<!doctype html>

  <div id="app-header"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4"><div><h1 class="h2 mb-1" data-i18n="ad.h1">Dashboard</h1><p class="text-muted mb-0" data-i18n="ad.sub">Keep the 15 schemes accurate and respond to what citizens ask.</p></div>
        <div class="d-flex flex-wrap gap-2"><button class="btn btn-ghost" id="reset-demo" type="button"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i><span data-i18n="ad.reset">Reset demo data</span></button><a class="btn btn-outline-primary" href="schemes.html"><i class="bi bi-journal-text" aria-hidden="true"></i><span data-i18n="ad.manageSchemes">Manage schemes</span></a><a class="btn btn-primary" href="activity.html"><i class="bi bi-inbox" aria-hidden="true"></i><span data-i18n="ad.review">Review queries</span></a></div></div>

        <div class="col-xl-6"><section class="panel h-100" aria-labelledby="na-h"><h2 id="na-h" class="h4"><i class="bi bi-exclamation-triangle text-warning" aria-hidden="true"></i> <span data-i18n="ad.attention">Needs attention</span></h2><div id="attention"></div></section></div>
        <div class="col-xl-6"><section class="panel h-100" aria-labelledby="cb-h"><h2 id="cb-h" class="h4"><i class="bi bi-chat-dots" aria-hidden="true"></i> <span data-i18n="ad.botActivity">Chatbot questions without an answer</span></h2><div id="bot-activity"></div></section></div>
        <div class="col-12"><section class="panel" aria-labelledby="rf-h"><div class="section-title mb-3"><h2 id="rf-h" class="h4 mb-0" data-i18n="ad.recentFb">Feedback by scheme</h2><a class="small fw-semibold" href="activity.html?tab=feedback"><span data-i18n="common.viewAll">View all</span> <i class="bi bi-arrow-right" aria-hidden="true"></i></a></div><div class="table-wrap"><div class="table-responsive"><table class="table table-cc"><thead><tr><th data-i18n="ad.scheme">Scheme</th><th data-i18n="ad.responses">Responses</th><th data-i18n="ad.useful">% useful</th><th data-i18n="ad.latest">Latest comment</th></tr></thead><tbody id="fb-rows"></tbody></table></div></div></section></div>
