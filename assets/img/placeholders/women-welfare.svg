<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="wwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1E6"/>
      <stop offset="50%" stop-color="#FDF1E6"/>
      <stop offset="100%" stop-color="#FAE0C9"/>
    </linearGradient>
    <radialGradient id="wwGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FAE0C9" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FDF1E6" stop-opacity="0"/>
    </radialGradient>
    <filter id="wwShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#E8710A" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#E8710A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#wwBg)"/>
  <rect width="800" height="500" fill="url(#wwGlow)"/>

  <!-- Geometric Decorative Elements -->
  <circle cx="690" cy="90" r="140" fill="#FAE0C9" opacity="0.35"/>
  <circle cx="110" cy="420" r="160" fill="#E8710A" opacity="0.05"/>
  <g stroke="#FAE0C9" stroke-width="1.5" opacity="0.4" fill="none">
    <circle cx="400" cy="230" r="150" stroke-dasharray="6 6"/>
    <circle cx="400" cy="230" r="180"/>
  </g>

  <!-- Central Elevated Card -->
  <g transform="translate(290, 120)" filter="url(#wwShadow)">
    <rect width="220" height="220" rx="36" fill="#FFFFFF" stroke="#FAE0C9" stroke-width="1.5"/>
    <rect x="20" y="20" width="180" height="180" rx="28" fill="#FDF1E6"/>

    <!-- Women Welfare Icon & Floral Accents -->
    <g transform="translate(74, 52) scale(4.5)">
      <!-- Female Symbol -->
      <circle cx="8" cy="6" r="4.5" fill="none" stroke="#E8710A" stroke-width="1.8"/>
      <path d="M8 10.5 L8 18 M5 14.5 L11 14.5" stroke="#E8710A" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Soft Lavender Blooming Leaves -->
      <path d="M3.5 6 C2 4, 1 7, 3.5 8 Z" fill="#F6C9A2"/>
      <path d="M12.5 6 C14 4, 15 7, 12.5 8 Z" fill="#F6C9A2"/>
    </g>

    <!-- Bottom Accent Pill -->
    <rect x="70" y="184" width="80" height="8" rx="4" fill="#E8710A"/>
  </g>
</svg>