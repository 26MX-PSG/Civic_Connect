<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="edBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7EEF7"/>
      <stop offset="50%" stop-color="#E7EEF7"/>
      <stop offset="100%" stop-color="#CBDAEE"/>
    </linearGradient>
    <radialGradient id="edGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#CBDAEE" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#E7EEF7" stop-opacity="0"/>
    </radialGradient>
    <filter id="edShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1257B0" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1257B0" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#edBg)"/>
  <rect width="800" height="500" fill="url(#edGlow)"/>

  <!-- Orbits -->
  <circle cx="690" cy="90" r="140" fill="#CBDAEE" opacity="0.35"/>
  <circle cx="110" cy="420" r="160" fill="#1257B0" opacity="0.05"/>
  <g stroke="#CBDAEE" stroke-width="1.5" opacity="0.4" fill="none">
    <circle cx="400" cy="230" r="150" stroke-dasharray="6 6"/>
    <circle cx="400" cy="230" r="180"/>
  </g>

  <!-- Central Card -->
  <g transform="translate(290, 120)" filter="url(#edShadow)">
    <rect width="220" height="220" rx="36" fill="#FFFFFF" stroke="#CBDAEE" stroke-width="1.5"/>
    <rect x="20" y="20" width="180" height="180" rx="28" fill="#E7EEF7"/>

    <!-- Graduation Cap & Tassel -->
    <g transform="translate(74, 52) scale(4.5)">
      <path d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0-1 1v2h3v-2a1 1 0 0 0-1-1V6.739l.686-.275a.5.5 0 0 0 .025-.917z" fill="#1257B0"/>
      <path d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.466z" fill="#1257B0"/>
      <!-- Soft Lavender Tassel / Sparkle -->
      <circle cx="15.5" cy="14" r="1.5" fill="#A5BFE1"/>
    </g>

    <rect x="70" y="184" width="80" height="8" rx="4" fill="#A5BFE1"/>
  </g>
</svg>