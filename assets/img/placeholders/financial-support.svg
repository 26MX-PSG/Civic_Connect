<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7F1F0"/>
      <stop offset="50%" stop-color="#E7F1F0"/>
      <stop offset="100%" stop-color="#CAE1DF"/>
    </linearGradient>
    <radialGradient id="fsGlow" cx="50%" cy="45%" r="50%">
