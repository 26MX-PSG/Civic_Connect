<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reset your CivicConnect password.">
  <title>Forgot password · CivicConnect</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="login" data-base="">
  <div id="app-header"></div>
  <main id="main" tabindex="-1">
    <div class="auth-wrap">
      <div class="auth-art" id="auth-art">
        <div class="quote"><p class="h5 text-white mb-1">“One place to understand the schemes meant for you.”</p><p class="small mb-0" style="color:var(--color-pale-lavender)">Bilingual · 15 curated schemes · Official sources</p></div>
      </div>
      <div class="auth-form">
        <div class="auth-card">
          <div class="mb-3"><a href="login.html" class="btn btn-link p-0"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to login</a></div>
          <h1 class="h2 mb-1">Reset your password</h1>
          <p class="text-muted">Enter the email address associated with your CivicConnect account. We’ll send a secure reset link if the account exists.</p>
          <form id="forgot-form" novalidate>
            <div id="forgot-message" class="alert d-none" role="alert"></div>
            <div class="mb-3">
              <label class="form-label required" for="fp-email">Email</label>
              <input type="email" class="form-control" id="fp-email" autocomplete="email" required>
              <div class="invalid-feedback">Enter a valid email address.</div>
            </div>
            <button class="btn btn-primary w-100 btn-lg" type="submit">Send reset link</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <div id="app-footer"></div>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/lang/ta.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/match.js"></script>
  <script src="assets/js/chatbot.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/forgot-password.js"></script>
</body>
</html>
